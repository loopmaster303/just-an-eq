[package]
name = "just-an-eq"
version = "0.1.0"
edition = "2021"
description = "just an eq: a tiny system-wide EQ in the tray (Windows and Linux)"
license = "MIT"

[[bin]]
name = "just-an-eq"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
